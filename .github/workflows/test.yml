name: Run Tests

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up R
        uses: r-lib/actions/setup-r@v2
        with:
          r-version: '4.4'

      - name: Install R package dependencies
        run: |
          install.packages(c("testthat", "BiocManager", "dplyr", "tibble", "stringr", "tidyr", "purrr"))
          BiocManager::install("limma", update = FALSE, ask = FALSE)
        shell: Rscript {0}

      - name: Run test suite
        working-directory: workflow/test
        run: Rscript run_tests.R

  python-test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install Python package dependencies
        run: pip install pytest numpy scipy pandas anndata

      - name: Run test suite
        working-directory: workflow/test
        run: python -m pytest -v
