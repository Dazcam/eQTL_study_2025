name: Run R Tests

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up R
        uses: r-lib/actions/setup-r@v2
        with:
          r-version: '4.4'

      - name: Install R package dependencies
        run: |
          install.packages(c("testthat", "BiocManager"))
          BiocManager::install("limma", update = FALSE, ask = FALSE)
        shell: Rscript {0}

      - name: Run test suite
        working-directory: workflow/test
        run: Rscript run_tests.R
