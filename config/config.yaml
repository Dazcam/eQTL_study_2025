# ------------  Pipeline 07: Replication (single-cell)  ------------

replication_sc:
  # Ziffra 2021 ST3 peak set(s) tested per L1 cell type; subclusters (e.g. GABA-1)
  # use the entry of their L1 parent
  ziffra_peak_sets:
    NPC:       ["RG_MACSpeaks"]
    Glu-UL:    ["ulEN_MACSpeaks"]
    Glu-DL:    ["dlEN_MACSpeaks"]
    GABA:      ["IN_CGE_MACSpeaks", "IN_MGE_MACSpeaks"]
    Endo-Peri: ["EndoMural_MACSpeaks"]
    MG:        ["Microglia_MACSpeaks"]
    OPC:       ["AstroOligo_MACSpeaks"]

  # Fetal L1 vs Jang et al. 2026 L1 pairs for beta_correlation (order = output row order)
  jang_comparisons:
    - {fetal: "Glu-UL",    jang: "Ext"}
    - {fetal: "Glu-DL",    jang: "Ext"}
    - {fetal: "GABA",      jang: "IN"}
    - {fetal: "NPC",       jang: "Ext"}
    - {fetal: "NPC",       jang: "IN"}
    - {fetal: "MG",        jang: "MG"}
    - {fetal: "OPC",       jang: "OPC"}
    - {fetal: "Endo-Peri", jang: "End"}

  dwnld_ziffra:
    output: ../resources/public_datasets/ziffra_2021/Ziffra_2021_supp_tables_2_13.xlsx
    web_link: https://static-content.springer.com/esm/art%3A10.1038%2Fs41586-021-03209-8/MediaObjects/41586_2021_3209_MOESM4_ESM.xlsx
    benchmark: reports/benchmarks/07replication_sc.dwnld_ziffra.benchmark.txt
    log: ../results/00LOG/07REPLICATION-SC/dwnld_ziffra.log

  snp_lookup:
    out_file: ../results/07REPLICATION-SC/atac_enrich/{cell_type}_{norm_method}_genPC_{geno_pc}_expPC_{exp_pc}.snp_lookup.rds
    script: ../scripts/repl_sc_snp_lookup.R
    benchmark: reports/benchmarks/07replication_sc.snp_lookup_{cell_type}_{norm_method}_genPC_{geno_pc}_expPC_{exp_pc}.benchmark.txt
    log: ../results/00LOG/07REPLICATION-SC/{cell_type}_{norm_method}_genPC_{geno_pc}_expPC_{exp_pc}_snp_lookup.log

  atac_enrich:
    seed: 1234  # set.seed() before the block-bootstrap permutations
    out_file: ../results/07REPLICATION-SC/atac_enrich/{cell_type}_{norm_method}_genPC_{geno_pc}_expPC_{exp_pc}.ziffra_peak_enrich.rds
    script: ../scripts/repl_sc_atac_enrichment.R
    benchmark: reports/benchmarks/07replication_sc.atac_enrich_{cell_type}_{norm_method}_genPC_{geno_pc}_expPC_{exp_pc}.benchmark.txt
    log: ../results/00LOG/07REPLICATION-SC/{cell_type}_{norm_method}_genPC_{geno_pc}_expPC_{exp_pc}_atac_enrich.log

  ziffra_summary:
    out_file: ../results/07REPLICATION-SC/atac_enrich/ziffra_overlaps_primary.tsv
    script: ../scripts/repl_sc_ziffra_summary.R
    benchmark: reports/benchmarks/07replication_sc.ziffra_summary.benchmark.txt
    log: ../results/00LOG/07REPLICATION-SC/ziffra_summary.log

  cat_nom_qtl:
    parquet: ../results/05TENSORQTL/tensorqtl_nom/{cell_type}_{norm_method}_genPC_{geno_pc}_expPC_{exp_pc}/{cell_type}_{norm_method}_nom.cis_qtl_pairs.{chr}.parquet
    output: ../results/07REPLICATION-SC/cat_nom_qtl/{cell_type}_{norm_method}_genPC_{geno_pc}_expPC_{exp_pc}_nom.cis_qtl_pairs.tsv.gz
    script: scripts/repl_sc_cat_nom_qtl.py
    benchmark: reports/benchmarks/07replication_sc.cat_nom_qtl_{cell_type}_{norm_method}_genPC_{geno_pc}_expPC_{exp_pc}.benchmark.txt
