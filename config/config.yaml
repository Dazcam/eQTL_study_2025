# ------------  Pipeline 06: Pseudotime  ------------

trajectories:
  - 'NPC-to-Glu-UL'

pseudotime:
  env: ../envs/pseudotime.yaml
  subset:
    h5ad:       ../results/06PSEUDOTIME/{trajectory}/adata_subset.h5ad
    log:        ../results/00LOG/06PSEUDOTIME/{trajectory}/subset.log
    script:     ../scripts/pseudotime_subset.py
    benchmark: reports/benchmarks/06pseudotime.pseudotime_subset_{trajectory}.benchmark.txt

  palantir:
    h5ad:          ../results/06PSEUDOTIME/{trajectory}/adata_pseudotime.h5ad
    log:           ../results/00LOG/06PSEUDOTIME/{trajectory}/pseudotime.log
    script:        ../scripts/pseudotime_trajectory.py
    n_neighbors:   10
    n_pcs:         30
    n_dcs:         15
    num_waypoints: 1000
    root_gene:     "PAX6"
    terminal_markers:
      Glu-DL: TLE4
      Glu-UL: SATB2
    benchmark: reports/benchmarks/06pseudotime.pseudotime_palantir_{trajectory}.benchmark.txt

  pseudobulk:
